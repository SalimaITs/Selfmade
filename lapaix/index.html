<title>LA PAIX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: application shell. Fixed left rail (wordmark, five modules, device identity) on desktop; top bar + bottom tab bar on phones.
   Brand: LA PAIX gold on deep night-blue. Serif for display moments only; a quiet grotesk for the working UI. Single dark identity by choice. */
:root{
  --night:#08111F; --navy:#0C1729; --panel:#101D33; --raise:#15243F; --line:#21324F; --line-soft:#1A2A45;
  --gold:#C9A961; --gold-hi:#E2C98F; --gold-deep:#8C7238; --on-gold:#1A1406;
  --ink:#E9EDF4; --soft:#BAC4D6; --muted:#8693AC;
  --ok:#6CBF95; --ok-bg:rgba(108,191,149,.12); --bad:#E2826F; --bad-bg:rgba(226,130,111,.13); --wait:#D9B26A; --wait-bg:rgba(217,178,106,.12);
  --f-display:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--night); color:var(--ink); font:15px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:40; background:var(--night)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:8px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); font-weight:600}

/* shell */
.shell{display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh}
.rail{position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:28px; padding:28px 18px 22px; border-right:1px solid var(--line-soft); background:var(--navy)}
.mark{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--gold); padding:0 8px}
.mark b{font-family:var(--f-display); font-weight:600; font-size:25px; letter-spacing:.22em; line-height:1}
.mark small{display:block; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-top:5px; font-weight:500}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; text-decoration:none; color:var(--soft); font-weight:500}
.nav a:hover{background:var(--panel); color:var(--ink)}
.nav a.on{background:var(--raise); color:var(--ink); box-shadow:inset 2px 0 0 var(--gold)}
.nav a svg{flex:none; color:var(--muted)}
.nav a.on svg{color:var(--gold)}
.nav .badge{margin-left:auto; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:var(--gold); color:var(--on-gold); font-size:11px; font-weight:700; display:grid; place-items:center}
.rail-foot{margin-top:auto; display:flex; flex-direction:column; gap:12px}
.company{padding:12px; border:1px solid var(--line-soft); border-radius:12px; font-size:13px}
.company strong{display:block; font-weight:600}
.company span{color:var(--muted); font-size:12px}
.whoami{display:flex; align-items:center; gap:10px; width:100%; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left}
.whoami:hover{border-color:var(--gold-deep)}
.whoami .meta{min-width:0; flex:1}
.whoami .meta b{display:block; font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.whoami .meta span{font-size:11.5px; color:var(--muted)}
.langs{display:flex; gap:4px}
.langs button{flex:1; border:1px solid var(--line-soft); background:transparent; border-radius:8px; padding:5px; font-size:12px; color:var(--muted); cursor:pointer; font-weight:600; letter-spacing:.06em}
.langs button[aria-pressed="true"]{color:var(--gold); border-color:var(--gold-deep)}
.avatar{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:12px; font-weight:700; letter-spacing:.04em; background:var(--raise); color:var(--gold-hi); border:1px solid var(--line)}
.avatar.sm{width:28px; height:28px; font-size:11px}

.topbar, .tabbar{display:none}
main{min-width:0; padding-block:36px 64px; padding-left:max(40px, env(safe-area-inset-left,0px)); padding-right:max(40px, env(safe-area-inset-right,0px))}
.page{max-width:1180px; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.phead{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 24px; padding-bottom:22px; border-bottom:1px solid var(--line-soft)}
.phead .tt{flex:1; min-width:240px; display:flex; flex-direction:column; gap:8px}
.phead h1{margin:0; font-family:var(--f-display); font-weight:600; font-size:clamp(34px,4vw,46px); line-height:1.02; letter-spacing:-.005em; text-wrap:balance}
.phead p{margin:0; color:var(--muted); max-width:62ch}
.actions{display:flex; flex-wrap:wrap; gap:10px; align-items:center}

@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex; position:sticky; top:env(safe-area-inset-top,0px); z-index:30; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); background:var(--navy); border-bottom:1px solid var(--line-soft)}
  .topbar .mark b{font-size:21px}
  .topbar .mark small{display:none}
  .topbar .right{display:flex; align-items:center; gap:8px}
  .tabbar{display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--navy); border-top:1px solid var(--line-soft); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 10px; font-size:10.5px; text-decoration:none; color:var(--muted); position:relative}
  .tabbar a.on{color:var(--gold)}
  .tabbar .dot{position:absolute; top:6px; left:calc(50% + 8px); width:8px; height:8px; border-radius:50%; background:var(--gold)}
  main{padding-block:22px 110px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
}

/* primitives */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; padding:10px 16px; font-weight:600; font-size:14px; cursor:pointer; border:1px solid transparent; text-decoration:none; white-space:nowrap}
.btn-gold{background:var(--gold); color:var(--on-gold)}
.btn-gold:hover{background:var(--gold-hi)}
.btn-line{background:transparent; border-color:var(--line); color:var(--ink)}
.btn-line:hover{border-color:var(--gold-deep)}
.btn-bad{background:transparent; border-color:rgba(226,130,111,.5); color:var(--bad)}
.btn-bad:hover{background:var(--bad-bg)}
.btn-ok{background:var(--ok); color:#0B1A12}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.lg{padding:13px 20px; font-size:15px}
.card{background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--r)}
.card-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:18px 20px 0}
.card-h h2{margin:0; font-size:15px; font-weight:600}
.card-h span{font-size:12.5px; color:var(--muted)}
.card-b{padding:16px 20px 20px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.bad{background:var(--bad-bg); color:var(--bad)}
.pill.wait{background:var(--wait-bg); color:var(--wait)}
.pill.mute{background:var(--raise); color:var(--muted)}
.tag{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 7px; font-weight:600}
label.f{display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; color:var(--soft)}
.in{width:100%; background:var(--night); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14.5px; color:var(--ink)}
.in:focus{border-color:var(--gold-deep); outline:none; box-shadow:0 0 0 3px rgba(201,169,97,.15)}
select.in{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%; background-size:5px 5px; background-repeat:no-repeat; padding-right:32px}
.grid2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px}
.grid-main{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:20px; align-items:start}
@media (max-width:1100px){ .grid-main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:720px){ .grid2{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex; flex-direction:column; gap:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:26px 20px; text-align:center; color:var(--muted); font-size:14px}
.notice{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); font-size:13.5px; color:var(--soft)}
.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap}
td{padding:12px 10px; border-bottom:1px solid var(--line-soft); white-space:nowrap; vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r, th.r{text-align:right}
.who{display:flex; align-items:center; gap:10px}
.who b{font-weight:600; display:block}
.who span{font-size:12px; color:var(--muted)}

/* banner for incoming requests */
.incoming-banner{display:flex; flex-wrap:wrap; align-items:center; gap:12px 18px; padding:16px 18px; border-radius:var(--r); background:linear-gradient(0deg, rgba(201,169,97,.10), rgba(201,169,97,.10)), var(--panel); border:1px solid var(--gold-deep)}
.incoming-banner .txt{flex:1; min-width:220px}
.incoming-banner .txt b{display:block; font-weight:600}
.incoming-banner .txt span{font-size:13px; color:var(--soft)}

/* report */
.kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; border:1px solid var(--line-soft); border-radius:var(--r); background:var(--panel)}
.kpi{padding:20px 22px; display:flex; flex-direction:column; gap:6px; min-width:0; border-right:1px solid var(--line-soft)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:12.5px; color:var(--muted)}
.kpi .v{font-family:var(--f-display); font-weight:600; font-size:44px; line-height:1; letter-spacing:-.01em}
.kpi .v.gold{color:var(--gold-hi)}
.kpi .d{font-size:12.5px; color:var(--soft)}
.kpi .d .up, .kpi .d .down{font-weight:700}
.kpi .d .up{color:var(--ok)} .kpi .d .down{color:var(--bad)} .kpi .d .flat{color:var(--muted)}
@media (max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .kpi:nth-child(2){border-right:0} .kpi:nth-child(-n+2){border-bottom:1px solid var(--line-soft)} }
@media (max-width:420px){ .kpi .v{font-size:36px} .kpi{padding:16px} }
.monthbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin}
.monthbar button{flex:none; border:1px solid var(--line-soft); background:transparent; border-radius:9px; padding:7px 11px; font-size:12.5px; color:var(--soft); cursor:pointer; font-weight:500}
.monthbar button:hover{border-color:var(--line)}
.monthbar button[aria-pressed="true"]{background:var(--gold); color:var(--on-gold); border-color:var(--gold); font-weight:700}
.summary{font-family:var(--f-display); font-size:23px; line-height:1.35; color:var(--ink); margin:0; max-width:60ch; text-wrap:pretty}
.summary em{font-style:normal; color:var(--gold-hi)}
.chart svg{display:block; width:100%; height:auto}
.chart .bar{cursor:pointer}
.legend{display:flex; gap:16px; font-size:12px; color:var(--muted)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.split{height:6px; border-radius:3px; background:var(--raise); overflow:hidden; min-width:80px}
.split i{display:block; height:100%; background:var(--gold)}
.incident{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line-soft)}
.incident:last-child{border-bottom:0}
.incident .dt{font-family:var(--f-mono); font-size:12px; color:var(--muted); width:52px}
.incident .ds b{font-weight:600}
.incident .ds span{display:block; font-size:12.5px; color:var(--muted)}
.incident .am{font-weight:600; text-align:right}

/* verify */
.seg{display:flex; flex-wrap:wrap; gap:6px}
.seg button{border:1px solid var(--line); background:transparent; border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer; color:var(--soft)}
.seg button[aria-pressed="true"]{border-color:var(--gold); color:var(--gold-hi); background:rgba(201,169,97,.08)}
.form{display:flex; flex-direction:column; gap:16px}
.hint{font-size:12.5px; color:var(--muted)}
.hint.gold{color:var(--gold-hi)}
.req{border:1px solid var(--line-soft); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--navy)}
.req.pending{border-color:var(--gold-deep)}
.req.rejected{border-color:rgba(226,130,111,.55); background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg)),var(--navy)}
.req.confirmed{border-color:rgba(108,191,149,.4)}
.req-top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.req-top b{font-weight:600; display:block}
.req-top span{font-size:12.5px; color:var(--muted)}
.req .amount{font-family:var(--f-display); font-size:30px; font-weight:600; line-height:1}
.req .note{font-size:13.5px; color:var(--soft)}
.req .q{font-weight:600; font-size:15px}
.req-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.timer{font-family:var(--f-mono); font-size:13px; color:var(--wait)}
.appr{display:flex; flex-wrap:wrap; gap:8px}
.alert{border-radius:10px; padding:12px 14px; font-size:14px; font-weight:600}
.alert.bad{background:var(--bad-bg); color:var(--bad)}
.alert.ok{background:var(--ok-bg); color:var(--ok)}
.alert.wait{background:var(--wait-bg); color:var(--wait)}
.alert small{display:block; font-weight:400; color:var(--soft); margin-top:4px; font-size:13px}
.codeinline{display:flex; gap:8px}
.codeinline .in{font-family:var(--f-mono); letter-spacing:.2em; max-width:150px}
.code-card{display:flex; align-items:center; gap:18px}
.code-digits{font-family:var(--f-mono); font-size:34px; font-weight:600; letter-spacing:.16em; color:var(--gold-hi)}
.ring{flex:none}

/* protocol */
.toggle{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line-soft); cursor:pointer}
.toggle:last-child{border-bottom:0}
.toggle input[type="checkbox"]{appearance:none; flex:none; width:38px; height:22px; border-radius:11px; background:var(--raise); border:1px solid var(--line); position:relative; cursor:pointer; margin-top:1px; transition:background .15s}
.toggle input[type="checkbox"]::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:transform .15s, background .15s}
.toggle input[type="checkbox"]:checked{background:var(--gold-deep); border-color:var(--gold)}
.toggle input[type="checkbox"]:checked::after{transform:translateX(16px); background:var(--gold-hi)}
.toggle b{display:block; font-weight:600; font-size:14px}
.toggle span{font-size:12.5px; color:var(--muted)}
.inline-num{display:flex; align-items:center; gap:8px; margin-top:8px}
.inline-num .in{max-width:140px}
.doc{background:#F6F3EC; color:#1A2233; border-radius:6px; padding:44px 44px 40px; font-size:14px; line-height:1.62; box-shadow:0 30px 60px -40px rgba(0,0,0,.8)}
.doc .dh{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:1px solid #D8D0BE; padding-bottom:16px; margin-bottom:18px}
.doc .dh .w{font-family:var(--f-display); font-weight:700; letter-spacing:.24em; color:#8C7238; font-size:18px}
.doc .dh .m{font-size:11.5px; color:#5B6475; text-align:right; font-family:var(--f-mono)}
.doc h3{font-family:var(--f-display); font-size:27px; font-weight:600; margin:0 0 4px; line-height:1.1}
.doc h4{font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin:20px 0 6px; color:#8C7238}
.doc p{margin:0 0 8px}
.doc ul{margin:0 0 8px; padding-left:20px}
.doc li{margin-bottom:3px}
.doc .norm{font-size:12.5px; color:#3A4458}
@media (max-width:600px){ .doc{padding:26px 20px} }

/* academy */
.courses{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px}
@media (max-width:1000px){ .courses{grid-template-columns:minmax(0,1fr)} }
.course{display:flex; flex-direction:column; gap:12px; padding:22px; border-radius:var(--r); background:var(--panel); border:1px solid var(--line-soft)}
.course .no{font-family:var(--f-display); font-size:44px; line-height:.9; color:var(--gold); font-weight:500}
.course h3{margin:0; font-size:17px; font-weight:600; line-height:1.3}
.course p{margin:0; font-size:13.5px; color:var(--muted); flex:1}
.course .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
.player{max-width:720px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:22px}
.steps-dots{display:flex; gap:6px}
.steps-dots i{flex:1; height:3px; border-radius:2px; background:var(--raise)}
.steps-dots i.on{background:var(--gold)}
.lesson h2{font-family:var(--f-display); font-weight:600; font-size:34px; line-height:1.1; margin:0 0 14px}
.lesson p{font-size:16.5px; line-height:1.65; color:var(--soft); margin:0 0 12px; max-width:62ch}
.lesson .callout{border-left:2px solid var(--gold); padding:4px 0 4px 16px; color:var(--ink); font-size:16px; margin:16px 0}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:block; width:100%; text-align:left; padding:14px 16px; border-radius:12px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:15px}
.opt:hover{border-color:var(--gold-deep)}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.explain{font-size:14px; color:var(--soft); padding:12px 14px; border-radius:10px; background:var(--raise)}
.player-nav{display:flex; justify-content:space-between; gap:10px}

/* modal */
.scrim{position:fixed; inset:0; z-index:50; background:rgba(4,8,16,.72); display:grid; place-items:center; padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.modal{width:min(480px,100%); max-height:100%; overflow:auto; background:var(--navy); border:1px solid var(--line); border-radius:18px; padding:26px; display:flex; flex-direction:column; gap:16px}
.modal h2{margin:0; font-family:var(--f-display); font-weight:600; font-size:30px; line-height:1.1}
.modal p{margin:0; color:var(--muted); font-size:14px}
.pick{display:flex; flex-direction:column; gap:8px}
.pick button{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; border:1px solid var(--line-soft); background:var(--panel); cursor:pointer; text-align:left}
.pick button:hover, .pick button[aria-pressed="true"]{border-color:var(--gold)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--night); padding:11px 18px; border-radius:10px; font-weight:600; font-size:14px; box-shadow:0 12px 30px rgba(0,0,0,.4)}
@media (max-width:980px){ .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))} }
.boot{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; min-height:50vh; color:var(--muted)}

function subscribe(){

    db.collection(c).onSnapshot(snap => {

  if (type === "bank") return !!p.bank;
  if (type === "password") return !!p.password;
  if (type === "data") return !!p.data;

}

function monthStats(ym){
  if (S.months[ym] && S.months[ym].closed) return S.months[ym];
  const vs = verifList().filter(v => ymOf(v.createdAt) === ym);
  const r = { month:ym, requests:vs.length, confirmed:0, rejected:0, expired:0, open:0, prevented:0, depts:{}, incidents:[], live:true };
  vs.forEach(v => {
    const s = statusOf(v), d = v.dept || "other";
    r.depts[d] = r.depts[d] || { req:0, rej:0 }; r.depts[d].req++;
    if (s === "confirmed") r.confirmed++;

  r.training = ms.length ? Math.round(done / ms.length * 100) : 0;

/* rotating code: HMAC-SHA-256 over the minute counter, truncated to 6 digits */
const codeCache = {};
const enc = s => new TextEncoder().encode(s);
async function codeFor(secret, step){
  const key = secret + ":" + step;
  if (codeCache[key]) return codeCache[key];
  let out;
  try {
    const k = await crypto.subtle.importKey("raw", enc(secret), { name:"HMAC", hash:"SHA-256" }, false, ["sign"]);
    const sig = new Uint8Array(await crypto.subtle.sign("HMAC", k, enc(String(step))));
    const o = sig[sig.length-1] & 15;
    const bin = ((sig[o] & 127) << 24) | (sig[o+1] << 16) | (sig[o+2] << 8) | sig[o+3];
    out = String(bin % 1000000).padStart(6, "0");
  } catch(e) {
    let h = 2166136261; for (const ch of key) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    out = String((h >>> 0) % 1000000).padStart(6, "0");
  }
  codeCache[key] = out; return out;
}

function barChart(keys, values, sel, color, id, fmt){

}

function approverChips(v){
  return `<div class="appr">${(v.approverIds||[]).map(id => { const m = member(id); const ok = (v.approvals||[]).includes(id); const rej = v.rejectedBy === id; return `<span class="pill ${rej?"bad":ok?"ok":"wait"}">${esc(m?m.name:"—")}</span>`; }).join("")}</div>`;
}
function reqCard(v, mine){
  const s = statusOf(v), rq = member(v.requesterId), deadline = v.createdAt + (policy().expiryMin||10)*60000;
  const title = esc(t("t_"+v.type)) + ` <span class="muted" style="font-weight:400">${esc(t("via"))} ${esc(t("c_"+v.channel))}</span>`;
  let body = "";
  if (mine) {
    if (s === "pending") {
      const primary = (v.approverIds||[])[0];
      const primaryDone = (v.approvals||[]).includes(primary);
      body = `<div class="alert wait">${esc(t("v_wait"))} · <span class="timer" data-deadline="${deadline}"></span></div>${approverChips(v)}
        ${primaryDone ? "" : `<div class="form" style="gap:8px"><span class="hint">${esc(t("v_code_check"))}: ${esc((member(primary)||{}).name||"")}</span><div class="codeinline"><input class="in" id="code-${v.id}" inputmode="numeric" maxlength="6" placeholder="${esc(t("v_code_ph"))}" value="${esc(UI.codeTry[v.id]||"")}" data-bind="code" data-id="${v.id}" autocomplete="off"><button class="btn btn-line" type="button" data-act="checkcode" data-id="${v.id}">${esc(t("v_code_btn"))}</button></div>${UI.codeMsg[v.id]?`<span class="hint" style="color:var(--bad)">${esc(UI.codeMsg[v.id])}</span>`:""}</div>`}`;
    } else if (s === "confirmed") body = `<div class="alert ok">${esc(v.method === "code" ? t("v_ok_code") : t("v_ok"))}</div>${approverChips(v)}`;
    else if (s === "rejected") body = `<div class="alert bad">${esc(t("v_bad"))}<small>${esc(t("v_bad_s"))}</small></div>`;
    else body = `<div class="alert wait">${esc(t("v_exp"))}<small>${esc(t("v_exp_s"))}</small></div>`;
  } else {
    body = `<span class="q">${esc(t("v_q"))}</span><div class="req-actions"><button class="btn btn-ok lg" type="button" data-act="approve" data-id="${v.id}">${esc(t("v_yes"))}</button><button class="btn btn-bad lg" type="button" data-act="reject" data-id="${v.id}">${esc(t("v_no"))}</button></div><span class="timer small" data-deadline="${deadline}"></span>`;
  }
  return `<article class="req ${s}">
    <div class="req-top"><div><b>${title}</b><span>${mine ? esc(timeStr(v.createdAt)) : esc((rq?rq.name:"—") + " · " + timeStr(v.createdAt))}</span></div>${v.amount ? `<span class="amount num">${eur(v.amount)}</span>` : ""}</div>
    ${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}${body}</article>`;
}

/* ───────────────────────── protocol ───────────────────────── */
function draft(){ if (!UI.policyDraft) UI.policyDraft = Object.assign({}, policy()); return UI.policyDraft; }
function policyDoc(p){
  const co = S.config.company || {}, de = lang === "de";
  const items = [];
  if (p.payment) items.push(de ? `Überweisungen ab ${eur(p.paymentThreshold)}` : `Payments from ${eur(p.paymentThreshold)}`);
  if (p.bank) items.push(de ? "jede Änderung von Bankverbindungen, unabhängig vom Betrag" : "every change of bank details, regardless of amount");
  if (p.password) items.push(de ? "Passwort-Resets, Freischaltungen und Änderungen der Zwei-Faktor-Anmeldung, die per Telefon, Chat oder E-Mail angefragt werden" : "password resets, account unlocks and two-factor changes requested by phone, chat or email");
  if (p.data) items.push(de ? "die Herausgabe von Personal-, Kunden- und Finanzdaten" : "the release of staff, customer and financial data");
  if (p.supplier) items.push(de ? "die Anlage neuer Lieferanten vor der ersten Zahlung" : "adding new suppliers before the first payment");
  return `<article class="doc" aria-label="Richtlinie">
    <div class="dh"><span class="w">LA PAIX</span><span class="m">${de?"Version":"Version"} ${p.version}<br>${esc(co.name||"")}</span></div>
    <h3>${de ? "Richtlinie zur Bestätigung kritischer Aufträge" : "Policy on confirming critical instructions"}</h3>
    <p class="norm">${de ? "Schutz vor Identitätsbetrug, CEO-Fraud und Deepfakes" : "Protection against impersonation, CEO fraud and deepfakes"}</p>
    <h4>1 · ${de?"Zweck und Geltungsbereich":"Purpose and scope"}</h4>
    <p>${de ? "Diese Richtlinie gilt für alle Beschäftigten und Standorte. Sie stellt sicher, dass kritische Aufträge nur ausgeführt werden, wenn die auftraggebende Person sie nachweislich selbst erteilt hat." : "This policy applies to all staff and sites. It ensures that critical instructions are only carried out when the person giving them has verifiably done so themselves."}</p>
    <h4>2 · ${de?"Bestätigungspflichtige Vorgänge":"Requests requiring confirmation"}</h4>
    <ul>${items.map(x => `<li>${esc(x)}</li>`).join("") || `<li>—</li>`}</ul>
    <h4>3 · ${de?"Ablauf der Bestätigung":"How confirmation works"}</h4>
    <p>${de ? `Die anfragende Person fordert die Bestätigung über LA PAIX an. Die auftraggebende Person bestätigt auf ihrem registrierten Gerät oder nennt ihren aktuellen LA PAIX Code. Die Bestätigung muss innerhalb von ${p.expiryMin} Minuten erfolgen.` : `The requesting person asks for confirmation through LA PAIX. The instructing person confirms on their registered device or reads out their current LA PAIX code. Confirmation must arrive within ${p.expiryMin} minutes.`}${p.fourEyes ? (de ? ` Ab ${eur(p.fourEyesThreshold)} ist zusätzlich eine zweite Bestätigung erforderlich (Vier-Augen-Prinzip).` : ` From ${eur(p.fourEyesThreshold)} a second confirmation is also required (four-eyes principle).`) : ""}</p>
    <h4>4 · ${de?"Fehlende oder verweigerte Bestätigung":"Missing or refused confirmation"}</h4>
    <p>${de ? "Ohne Bestätigung wird der Auftrag nicht ausgeführt, unabhängig von Dringlichkeit oder Absender. Rückrufe erfolgen ausschließlich unter bekannten Nummern aus den eigenen Stammdaten. Verweigerte Bestätigungen gelten als Sicherheitsvorfall und werden automatisch an die IT-Sicherheit gemeldet." : "Without confirmation the instruction is not carried out, regardless of urgency or sender. Call-backs only use known numbers from internal records. Refused confirmations count as security incidents and are reported to IT security automatically."}</p>
    <h4>5 · ${de?"Schulung":"Training"}</h4>
    <p>${de ? "Alle Beschäftigten absolvieren die LA PAIX Academy innerhalb von 30 Tagen nach Eintritt und danach jährlich." : "All staff complete the LA PAIX Academy within 30 days of joining and every year after that."}</p>
    <h4>6 · ${de?"Normbezug":"Standards"}</h4>
    <p class="norm">ISO/IEC 27001:2022 Anhang A 5.14 (${de?"Informationsübertragung":"information transfer"}), A 5.17 (${de?"Authentisierungsinformationen":"authentication information"}), A 5.24 (${de?"Planung des Vorfallmanagements":"incident management planning"}), A 6.3 (${de?"Sensibilisierung und Schulung":"awareness and training"}) · NIS2 ${de?"Art. 21 Abs. 2 lit. g und j":"Art. 21 (2) (g) and (j)"}</p>
  </article>`;
}

  const ms = members();
  const rows = ms.map(x => { const p = S.progress[x.id]||{}; const n = COURSES.filter(c => (p[c.id]||0) >= 2).length; return `<tr><td><div class="who"><span class="avatar sm">${esc(initials(x.name))}</span><div><b>${esc(x.name)}</b><span>${esc(roleOf(x))}</span></div></div></td>${COURSES.map(c => `<td><span class="pill ${(p[c.id]||0)>=2?"ok":"mute"}">${(p[c.id]||0)>=2?esc(t("a_done")):esc(t("a_open"))}</span></td>`).join("")}<td class="r num">${n}/${COURSES.length}</td></tr>`; }).join("");
  return head(t("a_eyebrow"), esc(t("a_title")), t("a_lead")) + notices() + (m ? "" : `<div class="notice">${esc(t("v_pick"))}</div>`) + `
  <div class="courses">${cards}</div>
  <section class="card"><div class="card-h"><h2>${esc(t("a_team"))}</h2></div><div class="card-b tablewrap"><table><thead><tr><th>${esc(t("t_h")[0])}</th>${COURSES.map((c,i) => `<th>${esc(lang==="de"?"Kurs":"Course")} ${i+1}</th>`).join("")}<th class="r">${esc(t("t_h")[2])}</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function renderPlayer(){
  const P = UI.player, c = COURSES.find(x => x.id === P.id), L = c.lessons[lang], Q = c.quiz[lang];
  const total = L.length + Q.length + 1;
  const dots = Array.from({ length: total }, (_, i) => `<i class="${i <= P.step ? "on" : ""}"></i>`).join("");
  let inner = "";
  if (P.step < L.length) {
    const [h, p, call] = L[P.step];
    inner = `<div class="lesson"><span class="eyebrow">${esc(c.title[lang])}</span><h2 style="margin-top:10px">${esc(h)}</h2><p>${esc(p)}</p><p class="callout">${esc(call)}</p></div>
      <div class="player-nav"><button class="btn btn-line" type="button" data-act="pback" ${P.step?"":"disabled"}>${esc(t("a_back"))}</button><button class="btn btn-gold" type="button" data-act="pnext">${esc(t("a_next"))}</button></div>`;
  } else if (P.step < L.length + Q.length) {
    const qi = P.step - L.length, [q, opts, right, why] = Q[qi], ans = P.answers[qi];
    inner = `<div class="lesson"><span class="eyebrow">${esc(t("a_quiz"))} ${qi+1} ${esc(t("a_of"))} ${Q.length}</span><h2 style="margin-top:10px;font-size:28px">${esc(q)}</h2></div>
      <div class="opts">${opts.map((o,i) => `<button class="opt ${ans!=null ? (i===right?"right":(i===ans?"wrong":"")) : ""}" type="button" data-act="answer" data-v="${i}" ${ans!=null?"disabled":""}>${esc(o)}</button>`).join("")}</div>
      ${ans!=null ? `<div class="explain">${esc(why)}</div>` : ""}
      <div class="player-nav"><button class="btn btn-line" type="button" data-act="pclose">${esc(t("a_close"))}</button><button class="btn btn-gold" type="button" data-act="pnext" ${ans==null?"disabled":""}>${esc(qi === Q.length-1 ? t("a_finish") : t("a_next"))}</button></div>`;
  } else {
    const score = P.answers.filter((a,i) => a === Q[i][2]).length, pass = score >= 2;
    inner = `<div class="lesson" style="text-align:center;padding:20px 0"><span class="eyebrow">${esc(c.title[lang])}</span><h2 style="margin-top:12px;font-size:44px;color:${pass?"var(--gold-hi)":"var(--ink)"}">${esc(t("a_result")(score))}</h2><p style="margin:0 auto">${esc(pass?t("a_pass"):t("a_fail"))}</p></div>
      <div class="player-nav" style="justify-content:center"><button class="btn btn-gold" type="button" data-act="pclose">${esc(t("a_close"))}</button></div>`;
  }
  return notices() + `<div class="player"><div class="steps-dots">${dots}</div>${inner}</div>`;
}

/* ───────────────────────── team ───────────────────────── */
function renderTeam(){
  const ms = members(), p = policy(), f = UI.team;
  const rows = ms.map(x => { const pr = S.progress[x.id]||{}; const n = COURSES.filter(c => (pr[c.id]||0) >= 2).length; const ack = (S.acks[x.id]||{}).version === p.version;
    return `<tr><td><div class="who"><span class="avatar sm">${esc(initials(x.name))}</span><div><b>${esc(x.name)}</b><span>${esc(roleOf(x))}</span></div></div></td><td>${esc(deptName(x.dept))}</td><td class="num">${n}/${COURSES.length}</td><td><span class="pill ${ack?"ok":"mute"}">${esc(ack?t("t_yes"):t("t_no"))}</span></td><td>${x.id===meId?`<span class="pill wait">${esc(t("t_this"))}</span>`:`<button class="btn btn-line" style="padding:6px 10px;font-size:12.5px" type="button" data-act="setme" data-id="${x.id}">${esc(t("t_this"))}</button>`}</td></tr>`; }).join("");
  return head(t("t_eyebrow"), esc(t("t_title")), t("t_lead")) + notices() + `
  <section class="card"><div class="card-b tablewrap" style="padding-top:20px"><table><thead><tr>${t("t_h").map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="5" class="empty">${esc(t("empty_team"))}</td></tr>`}</tbody></table></div></section>
  <section class="card" style="max-width:720px"><div class="card-h"><h2>${esc(t("t_add"))}</h2></div><div class="card-b">
    <form class="form" id="tform" novalidate><div class="grid2" style="gap:14px">
      <label class="f" for="t-name">${esc(t("t_name"))}<input class="in" id="t-name" value="${esc(f.name)}" data-bind="team.name" autocomplete="off"></label>
      <label class="f" for="t-role">${esc(t("t_role"))}<input class="in" id="t-role" value="${esc(f.role)}" data-bind="team.role" autocomplete="off"></label>
      <label class="f" for="t-dept">${esc(t("t_dept"))}<select class="in" id="t-dept" data-bind="team.dept">${["mgmt","finance","it","dubai","other"].map(d => `<option value="${d}" ${f.dept===d?"selected":""}>${esc(deptName(d))}</option>`).join("")}</select></label>
      <div style="display:flex;align-items:flex-end"><button class="btn btn-gold" type="submit" style="width:100%">${esc(t("t_add_btn"))}</button></div>
    </div></form></div></section>`;
}

/* ───────────────────────── modal ───────────────────────── */
function renderModal(){
  const root = $("modal-root");
  if (!UI.showWho) { root.innerHTML = ""; return; }
  const ms = members(), sel = UI.whoPick || meId;
  root.innerHTML = `<div class="scrim" data-act="closewho"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="who-t" data-stop="1">
    <span class="eyebrow">${esc(t("device"))}</span><h2 id="who-t">${esc(t("who_title"))}</h2><p>${esc(t("who_text"))}</p>
    <div class="pick">${ms.map(x => `<button type="button" data-act="whopick" data-id="${x.id}" aria-pressed="${x.id===sel}"><span class="avatar sm">${esc(initials(x.name))}</span><span><b style="font-weight:600;display:block">${esc(x.name)}</b><span class="small muted">${esc(roleOf(x))} · ${esc(deptName(x.dept))}</span></span></button>`).join("") || `<div class="empty">${esc(t("empty_team"))}</div>`}</div>
    <button class="btn btn-gold lg" type="button" data-act="whook" ${sel?"":"disabled"}>${esc(t("who_cta"))}</button></div></div>`;
}

/* ───────────────────────── render ───────────────────────── */
function render(){
  document.documentElement.lang = lang;
  renderChrome();
  if (!loaded) { renderModal(); return; }
  const a = document.activeElement, fid = a && a.id, s0 = a && a.selectionStart, s1 = a && a.selectionEnd;
  const r = route();
  const html = r === "verify" ? renderVerify() : r === "protokoll" ? renderPolicy() : r === "academy" ? renderAcademy() : r === "team" ? renderTeam() : renderReport();
  $("page").innerHTML = html;
  renderModal();
  if (fid) { const el = $(fid); if (el && el !== document.body) { el.focus({ preventScroll:true }); try { if (s0 != null && el.setSelectionRange) el.setSelectionRange(s0, s1); } catch(e) {} } }
  tick();
}
function toast(msg){ const r = $("toast-root"); r.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t = setTimeout(() => r.innerHTML = "", 2600); }

/* live timers: countdowns, code ring, expiry */
let lastExpiredCount = -1;
async function tick(){
  document.querySelectorAll("[data-deadline]").forEach(el => { const ms = Math.max(0, +el.dataset.deadline - Date.now()); const mm = Math.floor(ms/60000), ss = Math.floor(ms%60000/1000); el.textContent = `${mm}:${String(ss).padStart(2,"0")} ${t("v_left")}`; });
  const exp = Object.values(S.verifications).filter(v => statusOf(v) === "expired").length;
  if (lastExpiredCount !== -1 && exp !== lastExpiredCount) { lastExpiredCount = exp; render(); return; }
  lastExpiredCount = exp;
  const m = me(), codeEl = $("mycode"), arc = $("ringarc");
  if (m && codeEl && m.secret) {
    const c = await codeFor(m.secret, stepNow());
    if ($("mycode")) $("mycode").textContent = c.slice(0,3) + " " + c.slice(3);
    if (arc) arc.setAttribute("stroke-dashoffset", String(144.5 * ((Date.now() % 60000) / 60000)));
  }
}
setInterval(tick, 1000);

/* ───────────────────────── events ───────────────────────── */
document.addEventListener("input", e => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  const val = e.target.type === "checkbox" ? e.target.checked : e.target.value;
  if (b === "code") { UI.codeTry[e.target.dataset.id] = val.replace(/\D/g,"").slice(0,6); return; }
  const [grp, key] = b.split(".");
  if (grp === "v") { UI.verify[key] = val; if (key === "amount") { const m = me(); const h = $("vhints"); if (h) h.innerHTML = vHints(needsConfirm(UI.verify.type, val), fourEyesFor(UI.verify.type, val) && m ? member(secondApprover(m.id, UI.verify.approver)) : null); } }
  else if (grp === "team") UI.team[key] = val;
  else if (grp === "p") { const d = draft(); d[key] = (key === "paymentThreshold" || key === "fourEyesThreshold" || key === "expiryMin") && e.target.type !== "checkbox" ? Number(String(val).replace(/\D/g,"")) || 0 : val; if (e.target.type === "checkbox" || e.target.tagName === "SELECT") render(); else { /* keep typing smooth: refresh doc only */ scheduleRender(); } }
});
document.addEventListener("change", e => { const b = e.target.dataset && e.target.dataset.bind; if (b === "v.approver") { UI.verify.approver = e.target.value; render(); } });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("g.bar")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles:true })); } if (e.key === "Escape" && UI.showWho) { UI.showWho = false; renderModal(); } });
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "vform") createRequest();
  if (e.target.id === "tform") addMember();
});
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  if (act === "closewho") { if (e.target.closest("[data-stop]")) return; UI.showWho = false; renderModal(); return; }
  if (act === "lang") { lang = v; try { localStorage.setItem("lp-lang", lang); } catch(err) {} render(); return; }
  if (act === "who") { UI.showWho = true; UI.whoPick = meId; renderModal(); return; }
  if (act === "whopick") { UI.whoPick = id; renderModal(); return; }
  if (act === "whook" || act === "setme") { meId = act === "setme" ? id : UI.whoPick; try { localStorage.setItem("lp-me", meId); } catch(err) {} UI.showWho = false; render(); return; }
  if (act === "month") { UI.month = v; render(); return; }
  if (act === "download") return downloadReport();
  if (act === "vtype") { UI.verify.type = v; render(); return; }
  if (act === "vchan") { UI.verify.channel = v; render(); return; }
  if (act === "approve" || act === "reject") return decide(id, act === "approve");
  if (act === "checkcode") return checkCode(id);
  if (act === "savepolicy") { const p = policy(), d = draft(); const np = Object.assign({}, d, { version: p.version + 1, updatedAt: Date.now() }); UI.policyDraft = null; await put("config", "policy", np); toast(t("p_saved")); return; }
  if (act === "ack") { const m = me(); if (m) await put("acks", m.id, { version: policy().version, at: Date.now() }); return; }
  if (act === "course") { UI.player = { id, step:0, answers:[] }; render(); window.scrollTo(0,0); return; }
  if (act === "pnext") { const P = UI.player, c = COURSES.find(x => x.id === P.id); P.step++; if (P.step === c.lessons[lang].length + c.quiz[lang].length) { const Q = c.quiz[lang]; const score = P.answers.filter((a,i) => a === Q[i][2]).length; const m = me(); if (m) { const cur = Object.assign({}, S.progress[m.id]||{}); cur[P.id] = Math.max(cur[P.id]||0, score); await put("progress", m.id, cur); } } render(); return; }
  if (act === "pback") { UI.player.step = Math.max(0, UI.player.step - 1); render(); return; }
  if (act === "answer") { const P = UI.player, c = COURSES.find(x => x.id === P.id); P.answers[P.step - c.lessons[lang].length] = Number(v); render(); return; }
  if (act === "pclose") { UI.player = null; render(); return; }
});
async function createRequest(){
  const m = me(), f = UI.verify; if (!m || !f.approver) return;
  const amount = (f.type === "payment" || f.type === "supplier") ? Number(String(f.amount).replace(/\./g,"").replace(",", ".")) || 0 : 0;
  const approvers = [f.approver];
  if (fourEyesFor(f.type, amount)) { const s2 = secondApprover(m.id, f.approver); if (s2 && !approvers.includes(s2)) approvers.push(s2); }
  const id = uid("v");
  await put("verifications", id, { id, createdAt: Date.now(), requesterId: m.id, approverIds: approvers, approvals: [], type: f.type, channel: f.channel, amount, note: f.note.trim().slice(0, 200), status: "pending", method: "", dept: m.dept || "other" });
  UI.verify.amount = ""; UI.verify.note = "";
  toast(t("v_sent")); render();
}
async function decide(id, yes){
  const m = me(), v = S.verifications[id]; if (!m || !v || statusOf(v) !== "pending") return;
  const nv = Object.assign({}, v, { approvals: [...(v.approvals||[])] });
  if (yes) { if (!nv.approvals.includes(m.id)) nv.approvals.push(m.id); if (nv.approverIds.every(a => nv.approvals.includes(a))) { nv.status = "confirmed"; nv.method = nv.method || "app"; nv.resolvedAt = Date.now(); } }
  else { nv.status = "rejected"; nv.rejectedBy = m.id; nv.resolvedAt = Date.now(); }
  await put("verifications", id, nv);
  toast(yes ? t("v_confirmed_t") : t("v_rejected_t"));
}
async function checkCode(id){
  const v = S.verifications[id]; if (!v || statusOf(v) !== "pending") return;
  const primary = member(v.approverIds[0]); const entered = (UI.codeTry[id]||"").trim();
  if (!primary || !primary.secret || entered.length !== 6) { UI.codeMsg[id] = t("v_code_bad"); render(); return; }
  const s = stepNow(), ok = entered === await codeFor(primary.secret, s) || entered === await codeFor(primary.secret, s - 1);
  if (!ok) { UI.codeMsg[id] = t("v_code_bad"); render(); return; }
  UI.codeMsg[id] = ""; UI.codeTry[id] = "";
  const nv = Object.assign({}, v, { approvals: [...new Set([...(v.approvals||[]), primary.id])], method: "code" });
  if (nv.approverIds.every(a => nv.approvals.includes(a))) { nv.status = "confirmed"; nv.resolvedAt = Date.now(); }
  await put("verifications", id, nv);
  toast(t("v_confirmed_t"));
}
async function addMember(){
  const f = UI.team; const name = f.name.trim(); if (!name) return;
  const id = uid("m"), hex = Array.from(crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(8)) : [1,2,3,4,5,6,7,8]).map(b => b.toString(16).padStart(2,"0")).join("");
  await put("members", id, { id, name: name.slice(0,80), role: f.role.trim().slice(0,80) || "—", dept: f.dept, secret: hex, order: members().length });
  UI.team = { name:"", role:"", dept:f.dept }; toast(t("t_added")); render();
}
async function downloadReport(){
  if (!downloads) { toast(t("r_dl_off")); return; }
  try { await downloads.save({ filename: `LA-PAIX-${lang==="de"?"Monatsbericht":"Monthly-Report"}-${UI.month}.html`, data: reportFile() }); toast(t("r_saved")); }
  catch(e) { if (!e || e.code !== "declined") toast(t("r_dl_off")); }
}
window.addEventListener("hashchange", () => { UI.player = null; render(); window.scrollTo(0,0); });

/* ───────────────────────── boot ───────────────────────── */
render();
(async () => {
  for (let i = 0; i < 20 && !(window.claude && typeof window.claude.use === "function"); i++) await new Promise(r => setTimeout(r, 100));
  if (window.claude && typeof window.claude.use === "function") {
    try { downloads = await window.claude.use("downloads"); } catch(e) { downloads = null; }
    try { db = await window.claude.use("db"); } catch(e) { db = null; }
  }
  if (db) subscribe(); else loadLocal();
  setTimeout(() => { if (loaded && !me() && members().length && !UI.showWho) { UI.showWho = true; renderModal(); } }, 600);
})();
</script>
